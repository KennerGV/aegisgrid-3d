services:
  backend:
    build:
      context: ./backend/AegisGrid.Api
      dockerfile: Dockerfile
    container_name: aegisgrid-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: aegisgrid-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
